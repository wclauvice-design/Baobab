name: Keep-Alive Render API

on:
  schedule:
    # Exécution toutes les 10 minutes (Render s'endort après 15 min d'inactivité)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Westzone Render Backend
        run: |
          curl -f -s -m 30 https://baobab-api-7w7h.onrender.com/health || echo "Render wake ping sent"
