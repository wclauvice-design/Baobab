name: CI - Baobab Platform

on:
  push:
    branches: [main, master, 'codex/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Generate Prisma client
        run: npm run prisma:generate -w apps/api

      - name: Build API
        run: npm run build -w apps/api

      - name: Build PWA Frontend
        run: npm run build -w apps/pwa

      - name: Build Admin Back-office
        run: npm run build -w apps/admin

      - name: Run API Tests (if present)
        run: npm run test -w apps/api --if-present -- --passWithNoTests
