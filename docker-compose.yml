services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: westzone
      POSTGRES_PASSWORD: westzone
      POSTGRES_DB: westzone
    ports:
      - "5432:5432"
    volumes:
      - westzone_pgdata:/var/lib/postgresql/data

volumes:
  westzone_pgdata:
