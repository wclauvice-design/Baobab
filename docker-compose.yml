services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: baobab
      POSTGRES_PASSWORD: baobab
      POSTGRES_DB: baobab
    ports:
      - "5432:5432"
    volumes:
      - baobab_pgdata:/var/lib/postgresql/data

volumes:
  baobab_pgdata:
